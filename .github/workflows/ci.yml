name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: CI
    uses: nu12/templates/.github/workflows/rails-pr.v1.yml@main
    with:
      run-scan: true
      run-lint: true
      run-test: false
      run-docker-build: false
      ruby-version: .ruby-version
      docker-tag: 'latest'
    secrets: inherit

  test:
    name: CI / Pull Request (Test)
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Ruby
      uses: nu12/templates/actions/setup/ruby/v1@main
      with:
        ruby-version: .ruby-version

    - name: Run tests
      env:
        RAILS_ENV: test
        # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        # REDIS_URL: redis://localhost:6379/0
      run: bin/rails db:create && bin/rails db:migrate && bin/rails test
